# Cross-platform CI (sub-project XP, spec docs/superpowers/specs/2026-10-13-cross-platform-design.md section 2.6):
# MetalCreator builds, tests and launches on Linux (x86_64, aarch64) and Windows (x64). macOS stays verified locally (the
# full suite, OpenCascade, Metal), not here. A red run here never blocks a local macOS merge in xp-1, but it is reported.
#
# MetalUI is a sibling checkout (Package.swift's path dependency is ../MetalUI) at the commit pinned below; bump METALUI_COMMIT
# when MetalCreator adopts a MetalUI change.
#
# The Linux jobs run scripts/linux-test.sh, the script a developer runs in Docker on a Mac: build, the suite (exit 0, no
# "recorded an issue" or "failed after" line, twelve "Test run with" lines), the app's --self-test, and --smoke-test 20, then
# scripts/linux-test.sh package: a release tarball and an AppImage (packed from the tarball's tree by scripts/package-appimage.sh,
# which downloads its pinned packer; no FUSE is needed), each unpacked or extracted and run in a clean Ubuntu. The image draws on
# Mesa's lavapipe (a CPU Vulkan driver), so the SDL_GPU viewport's render and pick suites run on these GPU-less runners, and
# XP_REQUIRE_GPU=1 (set by the script) fails them instead of skipping when no device answers (xp-3).
#
# OpenCascade 7.9 (xp-2, spec section 3): on Linux it is built from a pinned commit in the Dockerfile's `occt` stage, which CI
# builds alone with buildx and caches in the GitHub Actions cache (scope xp-occt-<arch>); the first run on a new key builds it
# (about an hour on a 4-core runner), later runs restore it. On Windows it is vcpkg's `opencascade` port, pinned by the vcpkg
# commit below (the one whose port is 7.9.3), built in release and debug (the suite is a debug build, so it links OpenCascade's debug
# libraries: one C runtime on both sides), and vcpkg's binary cache folder is restored before and saved right after the install, so
# a red later step does not lose it.
#
# The viewport's HLSL shaders are compiled at build time (plan xp-3, user decision U1(b)); nothing compiled is checked in. SDL_shadercross,
# pinned by commit in scripts/shadercross.env (no release or tag upstream, no binary from MetalUI), is built on Linux by the Dockerfile's
# `shadercross` stage, natively on each runner, alone with buildx and cached (scope xp-shadercross-<arch>), and on Windows by
# scripts/install-shadercross.ps1, cached by actions/cache/restore and save under a key of the pin and the script. `swift build` compiles
# the shaders itself, through MetalUI's CompileShadersOnBuild plugin (BS-D), which finds shadercross by METALUI_SHADERCROSS (the Linux image's
# /opt/shadercross, set by scripts/linux-test.sh; the Windows install, set below); a build without it fails with MetalUI's message naming the
# tool and its commit.
#
# The Windows job is modelled on MetalUI's own Windows job (.github/workflows/sdl-gpu-linux.yml). Run 38546048595 was green: it builds, passes the
# suite (11 "Test run with" lines; 12 since xp-2 added CreatorOCCTTests) and passes the app's --self-test and --smoke-test. It stays continue-on-error, so it does not hide the Linux
# result, and the last step marks a red Windows run with a warning and a summary line (the run itself shows green); read its log on every run.

name: XP cross-platform

on:
  push:
    branches: [main, 'xp-*']
  pull_request:
  workflow_dispatch:

# The jobs only read the repository (checkout) and upload artifacts, which uses the runner's artifact token, not the GITHUB_TOKEN's
# scopes; the caches likewise. No secrets are used. Every action is pinned to a full commit SHA (the # comment is the tag it was).
permissions:
  contents: read

# A newer push to the same ref cancels the run in progress (the matrix has 90-minute jobs).
concurrency:
  group: xp-${{ github.ref }}
  cancel-in-progress: true

env:
  METALUI_REPOSITORY: mburger89/MetalUI
  METALUI_COMMIT: 65e300a029b344e77cfe556d69d14fce7e2c606d
  # microsoft/vcpkg at the commit whose ports/opencascade is 7.9.3 (port-version 1). packaging/windows/vcpkg.json names the same
  # commit as its builtin-baseline; CIPinTests checks they agree.
  VCPKG_COMMIT: 256310531c1e57ee83f8ac01f7bea7c1e56630f5

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: MetalCreator
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.METALUI_REPOSITORY }}
          ref: ${{ env.METALUI_COMMIT }}
          path: MetalUI
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build MetalUI's Linux image (Swift, SDL3 from source, Mesa, AccessKit)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: MetalUI/Backends/SDL
          file: MetalUI/Backends/SDL/linux/Dockerfile
          tags: metalui-portable:latest
          load: true
          cache-from: type=gha,scope=xp-portable-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=xp-portable-${{ matrix.arch }}
      - name: Build OpenCascade 7.9 (cached)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: MetalCreator/scripts/linux
          file: MetalCreator/scripts/linux/Dockerfile
          target: occt
          tags: metalcreator-occt:latest
          load: true
          cache-from: type=gha,scope=xp-occt-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=xp-occt-${{ matrix.arch }}
      - name: Build SDL_shadercross (the commit of scripts/shadercross.env; cached)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: MetalCreator/scripts/linux
          file: MetalCreator/scripts/linux/Dockerfile
          target: shadercross
          tags: metalcreator-shadercross:latest
          load: true
          cache-from: type=gha,scope=xp-shadercross-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=xp-shadercross-${{ matrix.arch }}
      - name: Build (the shaders compile with it), test, self-test and launch
        working-directory: MetalCreator
        env:
          OCCT_IMAGE: metalcreator-occt:latest
          SHADERCROSS_IMAGE: metalcreator-shadercross:latest
        run: scripts/linux-test.sh all
      - name: Package (tarball and AppImage), each checked in a clean Ubuntu
        working-directory: MetalCreator
        env:
          OCCT_IMAGE: metalcreator-occt:latest
          SHADERCROSS_IMAGE: metalcreator-shadercross:latest
        run: scripts/linux-test.sh package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MetalCreator-linux-${{ matrix.arch }}
          path: |
            MetalCreator/dist/MetalCreator-*-linux-*.tar.gz
            MetalCreator/dist/MetalCreator-*-linux-*.AppImage
          if-no-files-found: error

  windows:
    name: Windows x64 (unverified until it runs)
    # Never run yet: a red first run must not mask the Linux result. Read this job's log on every run (a failure here shows as a
    # green check); remove this line once the job has been green once.
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      SDL_VERSION: 3.4.16
      # sha256 of SDL3-devel-3.4.16-VC.zip (computed by downloading the release asset once); bump it with SDL_VERSION.
      SDL_SHA256: 1a784cb2a5c64d56fe7a62090fe9d242d9865f235e4ea9678f1a6ba4e693e7de
      EXPECTED_TEST_RUNS: 12
      # The viewport's SDL_GPU suites run on Direct3D 12's WARP (a CPU adapter) here; a runner without a device fails instead of
      # skipping (SDLGPUAvailabilityTests, xp-3).
      XP_REQUIRE_GPU: 1
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: MetalCreator
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.METALUI_REPOSITORY }}
          ref: ${{ env.METALUI_COMMIT }}
          path: MetalUI
      - uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057 # v0.5.0
        with:
          swift-version: swift-6.4.0-release
          swift-build: 6.4.0-RELEASE
      - name: Install SDL3 (prebuilt VC package)
        run: |
          $zip = "$env:RUNNER_TEMP\sdl3.zip"
          Invoke-WebRequest "https://github.com/libsdl-org/SDL/releases/download/release-$env:SDL_VERSION/SDL3-devel-$env:SDL_VERSION-VC.zip" -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:SDL_SHA256) { throw "SDL3-devel-$env:SDL_VERSION-VC.zip is not the pinned file: sha256 $actual, expected $env:SDL_SHA256" }
          "SDL3 zip sha256 OK ($actual)"
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          $root = "$env:RUNNER_TEMP\SDL3-$env:SDL_VERSION"
          "SDL3_INCLUDE=$root\include" >> $env:GITHUB_ENV
          "SDL3_LIB=$root\lib\x64" >> $env:GITHUB_ENV
          "SDL3_ROOT=$root" >> $env:GITHUB_ENV
          "$root\lib\x64" >> $env:GITHUB_PATH   # SDL3.dll at run time
      - name: Work out the vcpkg cache key
        id: vcpkg-key
        # vcpkg's package ABI hash includes the compiler hash (cl.exe version, Windows SDK), so a cache built on one runner image
        # does not restore on another: the image version and the cl.exe version go in the key. VCPKG_COMMIT stays in it too.
        run: |
          $cl = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find 'VC\Tools\MSVC\**\Hostx64\x64\cl.exe' | Select-Object -First 1
          $msvc = (Get-Item $cl).VersionInfo.ProductVersion
          "key=vcpkg-occt-$env:ImageVersion-msvc$msvc-${env:VCPKG_COMMIT}-${{ hashFiles('MetalCreator/packaging/windows/vcpkg.json') }}" >> $env:GITHUB_OUTPUT
      - name: Restore vcpkg's binary cache
        id: vcpkg-cache
        # Not actions/cache: its post step saves only when the whole job is green, and the first Windows runs are expected to be
        # red. The save step below runs as soon as the install is done.
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}\vcpkg-cache
          key: ${{ steps.vcpkg-key.outputs.key }}
      - name: Install OpenCascade 7.9 (vcpkg, release and debug libraries)
        id: occt
        # The vcpkg commit is fetched alone and bootstrapped; the port builds with the runner's Visual Studio, twice (release and
        # debug), tens of minutes the first time. A cache hit restores the built packages, so the step takes about a minute.
        # OCCT_PREFIX is what Package.swift reads. The suite is a debug build and links `debug\lib`, so `debug\bin` goes on
        # PATH for the test executables; the zip is a release build and takes `bin`.
        run: |
          $vcpkg = "$env:RUNNER_TEMP\vcpkg"
          git init -q $vcpkg
          git -C $vcpkg fetch -q --depth 1 https://github.com/microsoft/vcpkg $env:VCPKG_COMMIT
          git -C $vcpkg checkout -q FETCH_HEAD
          & "$vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\vcpkg-cache" | Out-Null
          $env:VCPKG_BINARY_SOURCES = "clear;files,$env:RUNNER_TEMP\vcpkg-cache,readwrite"
          & "$vcpkg\vcpkg.exe" install --triplet x64-windows --x-manifest-root="$env:GITHUB_WORKSPACE\MetalCreator\packaging\windows" --x-install-root="$env:RUNNER_TEMP\vcpkg-installed"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $prefix = "$env:RUNNER_TEMP\vcpkg-installed\x64-windows"
          # Package.swift links TKernel.lib from debug\lib (debug builds) and lib (release builds): say what the port really
          # installed before the build has to guess.
          $missing = 'lib\TKernel.lib', 'debug\lib\TKernel.lib', 'bin\TKernel.dll', 'debug\bin\TKernel.dll' |
              Where-Object { -not (Test-Path "$prefix\$_") }
          if ($missing) {
            Get-ChildItem $prefix -Recurse -Filter 'TKernel*' | ForEach-Object FullName
            throw "vcpkg did not install: $($missing -join ', ')"
          }
          "OCCT_PREFIX=$($prefix -replace '\\', '/')" >> $env:GITHUB_ENV
          "$prefix\debug\bin" >> $env:GITHUB_PATH
      - name: Save vcpkg's binary cache
        # Only after a whole install (a partial one would fill the key for good: a cache entry is never replaced), and whatever
        # the later steps do.
        if: ${{ always() && steps.occt.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}\vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Restore SDL_shadercross
        id: shadercross-cache
        # Not actions/cache, for the vcpkg cache's reason: the save step below runs as soon as the build is done.
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}\shadercross
          key: shadercross-windows-x64-${{ hashFiles('MetalCreator/scripts/shadercross.env', 'MetalCreator/scripts/install-shadercross.ps1') }}
      - name: Build SDL_shadercross (the pinned commit, once per pin)
        id: shadercross
        if: ${{ steps.shadercross-cache.outputs.cache-hit != 'true' }}
        working-directory: MetalCreator
        run: |
          scripts\install-shadercross.ps1 -Prefix "$env:RUNNER_TEMP\shadercross" -Sdl3Root $env:SDL3_ROOT
          exit $LASTEXITCODE
      - name: Save SDL_shadercross
        if: ${{ always() && steps.shadercross.outcome == 'success' && steps.shadercross-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}\shadercross
          key: ${{ steps.shadercross-cache.outputs.cache-primary-key }}
      - name: Point the build and the tests at the shader compiler
        # METALUI_SHADERCROSS is the compiler CompileShadersOnBuild runs on every `swift build` (MetalUI docs/packaging.md 4a). MetalUI's run-time
        # compiler (XP-G25) tries METALUI_SHADERCROSS_LIB first (4b). The zip's own check clears the second (scripts/package-windows.ps1), so a zip
        # without the DLLs still fails there.
        run: |
          "METALUI_SHADERCROSS=$env:RUNNER_TEMP\shadercross\bin\shadercross.exe" >> $env:GITHUB_ENV
          "METALUI_SHADERCROSS_LIB=$env:RUNNER_TEMP\shadercross\bin" >> $env:GITHUB_ENV
      - name: Fetch AccessKit
        working-directory: MetalUI/Backends/SDL
        # One SwiftPM flag per line: -Xcc -I<include> -Xswiftc -L<lib> (MetalUI PX-I item 2).
        run: |
          python scripts/fetch-accesskit.py --print-flags > "$env:RUNNER_TEMP\accesskit-flags.txt"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-Content "$env:RUNNER_TEMP\accesskit-flags.txt"
      - name: Build (compiles the viewport's shaders)
        working-directory: MetalCreator
        # No pkg-config on Windows: hand SwiftPM SDL's include and library paths.
        run: |
          $flags = @("-Xcc", "-I$env:SDL3_INCLUDE", "-Xswiftc", "-L$env:SDL3_LIB") +
                   @(Get-Content "$env:RUNNER_TEMP\accesskit-flags.txt")
          swift build @flags
          exit $LASTEXITCODE
      - name: Compile the generated kernels
        working-directory: MetalCreator
        # The Linux counterpart is scripts/linux-test.sh kernels: GeneratedKernelBuildTests (required where MetalUISDLGPU imports) needs every
        # generated kernel's .spv, .dxil, .msl and .json. The test target exports their HLSL, then the pinned SDL_shadercross compiles it
        # (which validates each kernel through DXC and DXIL).
        run: |
          $flags = @("-Xcc", "-I$env:SDL3_INCLUDE", "-Xswiftc", "-L$env:SDL3_LIB", "-Xlinker", "/STACK:16777216") +
                   @(Get-Content "$env:RUNNER_TEMP\accesskit-flags.txt")
          $env:XP_EXPORT_KERNELS = "1"
          swift test @flags --filter GeneratedKernelExport
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Remove-Item Env:XP_EXPORT_KERNELS
          scripts\compile-generated-kernels.ps1 -ShaderCross "$env:RUNNER_TEMP\shadercross\bin\shadercross.exe"
          exit $LASTEXITCODE
      - name: Test
        id: test
        working-directory: MetalCreator
        # The pass rule (spec 2.5): exit 0, no "recorded an issue" or "failed after" line, EXPECTED_TEST_RUNS "Test run with" lines.
        run: |
          # Windows threads get the executable's stack reserve (1 MB by default); the deepest layout trees in CreatorAppTests
          # overflow it (run 38532786786), so the test executables reserve 16 MB, as macOS and Linux threads effectively have.
          $flags = @("-Xcc", "-I$env:SDL3_INCLUDE", "-Xswiftc", "-L$env:SDL3_LIB", "-Xlinker", "/STACK:16777216") +
                   @(Get-Content "$env:RUNNER_TEMP\accesskit-flags.txt")
          $log = "$env:RUNNER_TEMP\test.log"
          swift test @flags 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          $text = Get-Content $log -Raw
          $runs = ([regex]::Matches($text, "Test run with")).Count
          if ($code -ne 0 -or $text -match "recorded an issue|failed after" -or $runs -ne [int]$env:EXPECTED_TEST_RUNS) {
            Write-Error "Windows: FAIL (exit $code, $runs of $env:EXPECTED_TEST_RUNS 'Test run with' lines)"
            exit 1
          }
          "Windows: PASS ($runs 'Test run with' lines)"
      - name: Self-test and launch smoke
        id: smoke
        working-directory: MetalCreator
        # Runs even when Test is red, so one run reports both.
        if: ${{ !cancelled() }}
        # --smoke-test opens the real window over SDL's offscreen renderers (Direct3D 12 on WARP) for 20 s and fails unless it
        # drew a first frame and the 3D viewport drew in it (xp-3); --self-test also finds the viewport's compiled shaders.
        run: |
          $flags = @("-Xcc", "-I$env:SDL3_INCLUDE", "-Xswiftc", "-L$env:SDL3_LIB") +
                   @(Get-Content "$env:RUNNER_TEMP\accesskit-flags.txt")
          $bin = (swift build @flags --show-bin-path)
          & "$bin\MetalCreatorApp.exe" --self-test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$bin\MetalCreatorApp.exe" --smoke-test 20
          exit $LASTEXITCODE
      - name: Build release (for the zip)
        id: release
        working-directory: MetalCreator
        # Its own step, so the first release build on Windows (a different optimiser pipeline from the debug build the suite uses,
        # and twice the compile time) shows red here on its own and leaves the suite's result readable.
        if: ${{ !cancelled() }}
        run: |
          $flags = @("-Xcc", "-I$env:SDL3_INCLUDE", "-Xswiftc", "-L$env:SDL3_LIB") +
                   @(Get-Content "$env:RUNNER_TEMP\accesskit-flags.txt")
          swift build -c release --product MetalCreatorApp @flags
          exit $LASTEXITCODE
      - name: Package (zip), checked on its own
        id: package
        working-directory: MetalCreator
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        # Unpacks the zip and runs --self-test with only Windows' folders on PATH, so a DLL missing from the zip fails here.
        run: |
          $flags = @("-Xcc", "-I$env:SDL3_INCLUDE", "-Xswiftc", "-L$env:SDL3_LIB") +
                   @(Get-Content "$env:RUNNER_TEMP\accesskit-flags.txt")
          scripts\package-windows.ps1 -NoBuild -BuildFlags $flags -SdlRoot $env:SDL3_ROOT -ShaderCrossRoot "$env:RUNNER_TEMP\shadercross"
          if (-not $?) { exit 1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        with:
          name: MetalCreator-windows-x64
          path: MetalCreator/dist/MetalCreator-*-windows-x64.zip
      - name: Mark a red Windows suite
        # The job is continue-on-error, so a red Windows run still shows a green check: say so where it is read.
        if: ${{ !cancelled() && (steps.test.outcome == 'failure' || steps.smoke.outcome == 'failure' || steps.release.outcome == 'failure' || steps.package.outcome == 'failure') }}
        run: |
          Write-Output "::warning::Windows suite red (continue-on-error)"
          "### Windows suite red (continue-on-error)`n`nTest step: ${{ steps.test.outcome }}; self-test and launch smoke: ${{ steps.smoke.outcome }}; release build: ${{ steps.release.outcome }}; package: ${{ steps.package.outcome }}. The run shows green because this job does not fail it; read the Windows log." >> $env:GITHUB_STEP_SUMMARY
